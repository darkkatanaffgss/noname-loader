[package]
name = "aether-loader"
version = "1.0.0"
description = "Dark acrylic game loader with startup morph, site API bridge & built-in EXE builder"
authors = ["Aether"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
